[project]
name = "kb-chat"
version = "0.1.0"
description = "Knowledge base chat service"
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langgraph-checkpoint-postgres",
    "langchain",
    "langchain-openai",
    "python-dotenv",
    "fastapi",
    "uvicorn",
    "tenacity",
    "pydantic-settings",
    "PyJWT>=2.10,<3",
    "psycopg[binary,pool]>=3.2.0",
    "slowapi",
    "httpx",
    "pyyaml",
    "pypinyin>=0.50.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
