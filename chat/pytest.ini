[pytest]
# 从项目根目录运行测试，容器内对应 /app
testpaths = tests
python_files = test_*.py
asyncio_mode = auto

# 标记说明：
#   unit / integration / e2e 按调用边界分类，不按是否出现 HTTP 类型分类。
#   scenario  — 对话场景标签，不能替代测试层级
#   smoke     — 核心冒烟用例，必须稳定通过
markers =
    unit: 直接调用函数或组件，外部依赖使用 mock，允许 MockTransport 协议测试
    integration: 组件协作，可访问真实外部 SDK/HTTP，不调用本服务 HTTP 入口
    e2e: 通过真实 HTTP 执行业务流程，不使用 TestClient 或 mock
    scenario: 对话场景标签，需另标 unit、integration 或 e2e
    smoke: 核心冒烟用例
    config: 配置校验测试（加载 YAML，不调 LLM，快）
    bench: 量化测试（打真实 LLM、慢，非回归断言，手动跑取数据）
