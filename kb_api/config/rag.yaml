indexer:
  callback:
    # 内网 Indexer 部署时改为可访问的 KB API 对外入口地址
    url: http://kb_api:6100/api/v1/index-results
    timeout: 10 # 单位秒

search:
  mode: hybrid
  top_k: 5
  rerank_fetch_k: 20
  rerank: true
  hybrid:
    rrf_k: 60
    fetch_k: 20

storage:
  endpoint_url: http://minio:9000
  bucket: kb-files
  presign_timeout: 60

parser:
  download_timeout: 60

  mineru:
    enable: true
    base_url: http://19.16.1.233:18002
    timeout: 300 # 单位秒

    # flash：快速提取，不用 VLM
    # basic：小模型解析，不用 VLM
    # standard/advanced：小模型 + VLM
    tier: standard # 仅用于 PDF；Office 新旧格式固定使用 Flash，TXT/Markdown 使用本地解析

    # auto: 自动判断是否需要 OCR
    # ocr: 强制识别图片中的文字
    # txt: 使用原生文本
    parse_method: auto

    retry:
      max_attempts: 3
      interval_seconds: 0.5

  mineru_cloud:
    enable: false
    base_url: https://mineru.net
    timeout: 300
    model_version: vlm # 云平台模型：pipeline / vlm；不是自建服务的 tier
    enable_formula: true
    enable_table: true
    retry:
      max_attempts: 3
      interval_seconds: 0.5

chunking:
  text:
    chunk_size: 500
    chunk_overlap: 80

api:
  rate_limit: 120/minute
  rate_limit_index: 10/minute

inference:
  siliconflow-cn:
    enable: false
    base_url: https://api.siliconflow.cn/v1
    retry:
      max_attempts: 3
      interval_seconds: 0.5
    dense:
      qwen3_embedding:
        enable: true
        model_name: Qwen/Qwen3-Embedding-0.6B
        dimensions: 1024
        timeout: 30
    rerank:
      qwen3_reranker:
        enable: true
        model_name: Qwen/Qwen3-Reranker-0.6B
        timeout: 30

  siliconflow-intl:
    enable: false
    base_url: https://api.siliconflow.com/v1
    retry:
      max_attempts: 3
      interval_seconds: 0.5
    dense:
      qwen3_embedding:
        enable: true
        model_name: Qwen/Qwen3-Embedding-0.6B
        dimensions: 1024
        timeout: 30
    rerank:
      qwen3_reranker:
        enable: true
        model_name: Qwen/Qwen3-Reranker-0.6B
        timeout: 30

  tei:
    enable: true
    retry:
      max_attempts: 3
      interval_seconds: 0.5
    dense:
      bge_m3:
        enable: true
        model_name: BAAI/bge-m3
        base_url: http://19.16.1.233:8081
        dimensions: 1024
        batch_size: 32 # 每次 embedding 请求的分片数，不超过 TEI 的 max_client_batch_size
        timeout: 30
    rerank:
      bge_m3:
        enable: true
        model_name: BAAI/bge-reranker-v2-m3
        base_url: http://19.16.1.233:8082
        timeout: 30

vector_db:
  qdrant:
    enable: false
    bm25: true
    base_url: http://qdrant:6333
    query_timeout: 10
    write_timeout: 60
    init_timeout: 120
    drop_timeout: 180
    retry:
      max_attempts: 3
      interval_seconds: 0.5
    quantization:
      enable: false
      type: int8
      quantile: 0.99
      always_ram: true

  milvus:
    enable: true
    bm25: true
    base_url: http://milvus:19530
    query_timeout: 10
    write_timeout: 60
    init_timeout: 120
    drop_timeout: 180
    retry:
      max_attempts: 3
      interval_seconds: 0.5

  qdrant_cloud:
    enable: false
    bm25: true
    base_url: https://ba2d743e-5dad-4ee8-b181-e3a05e4df4ae.sa-east-1-0.aws.cloud.qdrant.io
    query_timeout: 10
    write_timeout: 60
    init_timeout: 120
    drop_timeout: 180
    retry:
      max_attempts: 3
      interval_seconds: 0.5
    quantization:
      enable: false
      type: int8
      quantile: 0.99
      always_ram: true

  milvus_cloud:
    enable: false
    bm25: true
    base_url: https://in03-748dd5b2366e2b6.serverless.ali-cn-hangzhou.cloud.zilliz.com.cn
    query_timeout: 10
    write_timeout: 60
    init_timeout: 120
    drop_timeout: 180
    retry:
      max_attempts: 3
      interval_seconds: 0.5
