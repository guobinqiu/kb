[project]
name = "kb-api"
version = "0.1.0"
description = "Knowledge base management API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "minio>=7.2,<8",
    "pika>=1.3,<2",
    "pymilvus>=3.0.0",
    "qdrant-client>=1.19.0",
    "pyyaml>=6.0,<7",
    "uvicorn[standard]>=0.34,<1",
    "opentelemetry-sdk>=1.38,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.38,<2",
    "psycopg[binary]>=3.2,<4",
    "python-multipart>=0.0.20,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests", "rag_search/tests", "rag_search/inference/tests"]
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "e2e: end-to-end tests",
]
