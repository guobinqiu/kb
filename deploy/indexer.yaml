x-app-service: &app-service
  env_file:
    - .env
  environment:
    TZ: Asia/Shanghai
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "5"
  networks:
    - kb-net

services:
  rag_indexer:
    container_name: rag_indexer
    <<: *app-service
    image: kb-rag-indexer:${IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: kb_api/rag_indexer/Dockerfile
      args:
        USE_CN_MIRROR: ${USE_CN_MIRROR:-true}
    command: ["/app/.venv/bin/python", "-m", "kb_api.rag_indexer.app.main"]
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import os; os.kill(1, 0)"]
      interval: 10s
      timeout: 3s
      retries: 60
      start_period: 30s
    volumes:
      - ../kb_api/config:/app/kb_api/config:ro

networks:
  kb-net:
    external: true
