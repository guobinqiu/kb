x-app-service: &app-service
  env_file:
    - .env
  environment:
    TZ: Asia/Shanghai
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "5"
  networks:
    - kb-net

services:
  rag_indexer:
    container_name: rag_indexer
    <<: *app-service
    image: kb-rag-indexer:${IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: kb_api/rag_indexer/Dockerfile
      args:
        USE_CN_MIRROR: ${USE_CN_MIRROR:-true}
    command: ["/app/.venv/bin/uvicorn", "kb_api.rag_indexer.app.main:app", "--host", "0.0.0.0", "--port", "6000", "--workers", "1"]
    healthcheck:
      test: ["CMD-SHELL", "/app/.venv/bin/python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:6000/health', timeout=2).read()\""]
      interval: 10s
      timeout: 3s
      retries: 60
      start_period: 30s
    volumes:
      - ../kb_api/config:/app/kb_api/config:ro

networks:
  kb-net:
    external: true
