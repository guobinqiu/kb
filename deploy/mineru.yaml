services:
  mineru-vlm-server:
    container_name: mineru-vlm-server
    # 使用官方 Dockerfile 构建的本地 GPU 镜像，构建步骤见 scripts/deploy_mineru_services.txt。
    image: mineru:4
    restart: unless-stopped
    environment:
      MINERU_MODEL_SOURCE: local
    entrypoint: ["mineru-kit"]
    command: ["vlm-server", "--host", "0.0.0.0", "--port", "30000", "--gpu-memory-utilization", "0.45"]
    gpus: all
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:30000/health"]
    networks:
      - kb-net

  mineru-api-server:
    container_name: mineru-api-server
    image: mineru:4
    restart: unless-stopped
    environment:
      MINERU_MODEL_SOURCE: local
    entrypoint: ["mineru-kit"]
    # 关闭图片内容分析，与本地 SDK 的 image_analysis: false 一致；表格识别不受影响。
    command: ["api-server", "--host", "0.0.0.0", "--port", "8000", "--vlm-server-url", "http://mineru-vlm-server:30000", "--disable-image-analysis"]
    ports:
      - "18002:8000"
    gpus: all
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/v1/health"]
    networks:
      - kb-net

networks:
  kb-net:
    external: true
