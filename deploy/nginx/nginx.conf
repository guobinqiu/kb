server {
    listen 80;
    server_name _;
    access_log off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 200m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-App-Id, X-Workspace-Id, X-Trace-Id, traceparent" always;
    add_header Access-Control-Expose-Headers "X-Trace-Id" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location = /_kb_auth {
        internal;
        set $kb_upstream kb_api:6100;
        proxy_pass http://$kb_upstream/api/v1/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-App-Id $http_x_app_id;
        proxy_set_header X-Workspace-Id $http_x_workspace_id;
    }

    location = /api/v1/auth/login {
        set $kb_upstream kb_api:6100;
        proxy_pass http://$kb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/auth/verify {
        return 404;
    }

    location = /api/v1/index-results {
        set $kb_upstream kb_api:6100;
        proxy_pass http://$kb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/auth/ {
        set $kb_upstream kb_api:6100;
        proxy_pass http://$kb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/(apps|orgs|users|files)(?:/|$) {
        set $kb_upstream kb_api:6100;
        proxy_pass http://$kb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
    }

    location ^~ /api/v1/workspaces/ {
        set $kb_upstream kb_api:6100;
        proxy_pass http://$kb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 900s;
    }

    location /api/v1/llm/ {
        auth_request /_kb_auth;
        auth_request_set $principal_type $upstream_http_x_principal_type;
        auth_request_set $app_id $upstream_http_x_app_id;
        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $org_id $upstream_http_x_org_id;
        set $chat_upstream chat:6001;
        proxy_pass http://$chat_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Principal-Type $principal_type;
        proxy_set_header X-App-Id $app_id;
        proxy_set_header X-User-Id $user_id;
        proxy_set_header X-Workspace-Id $http_x_workspace_id;
        proxy_set_header X-Org-Id $org_id;
        proxy_buffering off;
        proxy_read_timeout 900s;
    }

    location = /health {
        set $kb_upstream kb_api:6100;
        proxy_pass http://$kb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/rag/(search|config)$ {
        auth_request /_kb_auth;
        auth_request_set $principal_type $upstream_http_x_principal_type;
        auth_request_set $app_id $upstream_http_x_app_id;
        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $org_id $upstream_http_x_org_id;
        set $kb_upstream kb_api:6100;
        proxy_pass http://$kb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Principal-Type $principal_type;
        proxy_set_header X-App-Id $app_id;
        proxy_set_header X-User-Id $user_id;
        proxy_set_header X-Org-Id $org_id;
        proxy_read_timeout 30s;
    }

    location /api/v1/rag/ {
        auth_request /_kb_auth;
        auth_request_set $principal_type $upstream_http_x_principal_type;
        auth_request_set $app_id $upstream_http_x_app_id;
        auth_request_set $user_id $upstream_http_x_user_id;
        auth_request_set $org_id $upstream_http_x_org_id;
        set $kb_upstream kb_api:6100;
        proxy_pass http://$kb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Principal-Type $principal_type;
        proxy_set_header X-App-Id $app_id;
        proxy_set_header X-User-Id $user_id;
        proxy_set_header X-Org-Id $org_id;
        proxy_read_timeout 900s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
