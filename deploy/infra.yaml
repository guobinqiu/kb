x-infra-service: &infra-service
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "5"
  networks:
    - kb-net

services:
  otel-collector:
    container_name: otel-collector
    <<: *infra-service
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector:0.161.0
    command: ["--config", "/etc/otelcol/config.yaml"]
    environment:
      GOMEMLIMIT: 400MiB
    mem_limit: 512m
    depends_on:
      - jaeger
    expose:
      - "4317"
      - "4318"
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro

  jaeger:
    container_name: jaeger
    <<: *infra-service
    image: jaegertracing/jaeger:2.21.0
    user: "10001:10001"
    command: ["--config", "/etc/jaeger/config.yaml"]
    ports:
      - "127.0.0.1:16686:16686"
    expose:
      - "4318"
    volumes:
      - ./jaeger/config.yaml:/etc/jaeger/config.yaml:ro
      - ../jaeger_data:/badger

  postgres:
    container_name: postgres
    <<: *infra-service
    image: paradedb/paradedb:0.25.10-pg16
    command: ["postgres", "-c", "shared_preload_libraries=pg_search"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - ../pg_data:/var/lib/postgresql/data

  rabbitmq:
    container_name: rabbitmq
    <<: *infra-service
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ../rabbitmq_data:/var/lib/rabbitmq

  qdrant:
    container_name: qdrant
    <<: *infra-service
    profiles: ["qdrant"]
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ../qdrant_data:/qdrant/storage

  minio:
    container_name: minio
    <<: *infra-service
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    command: minio server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ../minio_data:/data

  etcd:
    container_name: etcd
    <<: *infra-service
    profiles: ["milvus"]
    image: quay.io/coreos/etcd:v3.5.25
    command: >
      etcd
      -advertise-client-urls=http://etcd:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    ports:
      - "2379:2379"
    volumes:
      - ../milvus_data/standalone/etcd:/etcd

  milvus:
    container_name: milvus
    <<: *infra-service
    profiles: ["milvus"]
    image: milvusdb/milvus:v3.0.0
    command: ["milvus", "run", "standalone"]
    depends_on:
      - etcd
      - minio
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - ../milvus_data/standalone/milvus:/var/lib/milvus

networks:
  kb-net:
    external: true
