services:
  webui:
    container_name: kb_webui
    image: kb-webui:${IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: webui/Dockerfile
    ports:
      - "5175:80"
    restart: unless-stopped
    logging:
      driver: "none"
    networks:
      - kb-net

networks:
  kb-net:
    external: true
