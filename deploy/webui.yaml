services:
  nginx:
    container_name: nginx
    image: nginx:1.27-alpine
    ports:
      - "5175:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../webui/dist:/usr/share/nginx/html:ro
    restart: unless-stopped
    logging:
      driver: "none"
    networks:
      - kb-net

networks:
  kb-net:
    external: true
